[project]
name = "prehearing"
version = "0.1.0"
description = "Ingest a case file, understand it, generate hearing arguments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openai>=1.54",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "google-auth[requests]>=2.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
